# ============================================================
#  DS2 Radar 3D  —  game-version config
# ============================================================
#  Already filled in and VALIDATED for:
#      Dark Souls II: Scholar of the First Sin  (CUSA01760, patch 1.02)
#
#  Different version/patch? The offsets will be different.
#  Run the 'finder' tool (finder_scan.py + finder_validate.py),
#  generate a new config.ini and replace this file. Only these
#  numbers change between versions.
# ============================================================

[ps4]
# Your PS4 IP (with the ps4debug payload already loaded)
ip = 192.168.1.104

[position]
# Static pointer chain -> position block [1.0, X, Y, Z]
#   base = *( *(eboot_base + static_off) + offsets[0] ) + offsets[1] ...
static_off = 0x21976C0
offsets    = 0x290, 0x3AC

[area]
# Addresses of the current map name "MM_NN" (e.g. "10_04") in the eboot's
# static data. Offsets are relative to eboot_base (the server adds it).
offsets = 0x21C77D1, 0x21C7801, 0x21C7831, 0x2209851, 0x2209881

[info]
game    = Dark Souls II: Scholar of the First Sin
version = CUSA01760 1.02
